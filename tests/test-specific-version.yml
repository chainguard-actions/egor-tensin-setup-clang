name: Test specific version install (clang-18)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "Installing PowerShell..."
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends \
              wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          else
            echo "PowerShell already available: $(pwsh --version)"
          fi

      - id: action
        uses: .
        with:
          version: '18'
          platform: x64
          cc: '1'

      - name: Assert clang output contains version suffix
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ "$CLANG" != "clang-18" ]; then
            echo "FAIL: expected 'clang-18' but got '$CLANG'"
            exit 1
          fi
          echo "PASS: clang output is '$CLANG'"

      - name: Assert clangxx output contains version suffix
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ "$CLANGXX" != "clang++-18" ]; then
            echo "FAIL: expected 'clang++-18' but got '$CLANGXX'"
            exit 1
          fi
          echo "PASS: clangxx output is '$CLANGXX'"

      - name: Assert versioned clang binary is executable
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking if '$CLANG' is available..."
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: '$CLANG' not found in PATH"
            exit 1
          fi
          echo "PASS: '$CLANG' is available at $(command -v "$CLANG")"
          "$CLANG" --version

      - name: Assert versioned clang++ binary is executable
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "Checking if '$CLANGXX' is available..."
          if ! command -v "$CLANGXX" > /dev/null 2>&1; then
            echo "FAIL: '$CLANGXX' not found in PATH"
            exit 1
          fi
          echo "PASS: '$CLANGXX' is available at $(command -v "$CLANGXX")"
          "$CLANGXX" --version

      - name: Assert clang symlink points to versioned binary (cc=1)
        run: |
          echo "Checking if 'clang' symlink exists..."
          if ! command -v clang > /dev/null 2>&1; then
            echo "FAIL: 'clang' not found in PATH"
            exit 1
          fi
          echo "PASS: 'clang' is available at $(command -v clang)"
          clang --version

      - name: Assert cc symlink exists (cc=1)
        run: |
          echo "Checking if 'cc' symlink exists..."
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: 'cc' not found in PATH"
            exit 1
          fi
          echo "PASS: 'cc' is available at $(command -v cc)"
          cc --version
