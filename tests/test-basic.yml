name: Test basic usage (latest clang)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -yq powershell

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: '1'

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output is '$CLANG'"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clang++ output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output is '$CLANGXX'"

      - name: Assert clang binary is available
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that '$CLANG' is on PATH..."
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: '$CLANG' not found on PATH"
            exit 1
          fi
          echo "PASS: '$CLANG' is available"
          "$CLANG" --version

      - name: Assert clang++ binary is available
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "Checking that '$CLANGXX' is on PATH..."
          if ! command -v "$CLANGXX" > /dev/null 2>&1; then
            echo "FAIL: '$CLANGXX' not found on PATH"
            exit 1
          fi
          echo "PASS: '$CLANGXX' is available"
          "$CLANGXX" --version

      - name: Assert cc symlink is set up
        run: |
          echo "Checking that 'cc' symlink exists..."
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: 'cc' not found on PATH"
            exit 1
          fi
          CC_VERSION=$(cc --version 2>&1 | head -1)
          echo "cc --version: $CC_VERSION"
          if ! echo "$CC_VERSION" | grep -qi 'clang'; then
            echo "FAIL: 'cc' does not appear to be clang"
            exit 1
          fi
          echo "PASS: 'cc' is clang"

      - name: Assert c++ symlink is set up
        run: |
          echo "Checking that 'c++' symlink exists..."
          if ! command -v c++ > /dev/null 2>&1; then
            echo "FAIL: 'c++' not found on PATH"
            exit 1
          fi
          CXX_VERSION=$(c++ --version 2>&1 | head -1)
          echo "c++ --version: $CXX_VERSION"
          if ! echo "$CXX_VERSION" | grep -qi 'clang'; then
            echo "FAIL: 'c++' does not appear to be clang"
            exit 1
          fi
          echo "PASS: 'c++' is clang"
