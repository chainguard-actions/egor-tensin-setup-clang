name: Test basic usage (latest clang, default settings)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell if missing
        run: |
          if command -v pwsh > /dev/null 2>&1; then
            echo "pwsh already available: $(pwsh --version)"
            exit 0
          fi
          echo "Installing PowerShell Core..."
          # Use snap as a reliable cross-version method
          if command -v snap > /dev/null 2>&1; then
            sudo snap install powershell --classic
          else
            # Fallback: install via Microsoft apt repo
            UBUNTU_VERSION=$(lsb_release -rs)
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends wget ca-certificates
            wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          fi
          pwsh --version

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: 1

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output = $CLANG"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output = $CLANGXX"

      - name: Assert clang binary is executable
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that '$CLANG' is on PATH and executable"
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: $CLANG not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANG found at $(command -v "$CLANG")"

      - name: Assert clang++ binary is executable
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "Checking that '$CLANGXX' is on PATH and executable"
          if ! command -v "$CLANGXX" > /dev/null 2>&1; then
            echo "FAIL: $CLANGXX not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANGXX found at $(command -v "$CLANGXX")"

      - name: Assert cc symlink is set up
        run: |
          echo "Checking that 'cc' symlink exists"
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: cc not found on PATH"
            exit 1
          fi
          echo "PASS: cc found at $(command -v cc)"

      - name: Assert c++ symlink is set up
        run: |
          echo "Checking that 'c++' symlink exists"
          if ! command -v c++ > /dev/null 2>&1; then
            echo "FAIL: c++ not found on PATH"
            exit 1
          fi
          echo "PASS: c++ found at $(command -v c++)"

      - name: Assert clang can compile a simple program
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Compiling a simple C program with $CLANG"
          printf '#include <stdio.h>\nint main() { printf("Hello from clang!\\n"); return 0; }\n' > /tmp/hello.c
          "$CLANG" /tmp/hello.c -o /tmp/hello
          output=$(/tmp/hello)
          echo "Program output: $output"
          if [ "$output" != "Hello from clang!" ]; then
            echo "FAIL: unexpected output: $output"
            exit 1
          fi
          echo "PASS: clang compiled and ran successfully"
