name: Test basic usage (latest clang)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell if not present
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "pwsh not found, installing..."
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends \
              wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          else
            echo "pwsh already available: $(pwsh --version)"
          fi

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: 1

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output = $CLANG"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output = $CLANGXX"

      - name: Assert clang binary is executable
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that '$CLANG' is on PATH and executable..."
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: '$CLANG' not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANG found at $(command -v "$CLANG")"

      - name: Assert clang++ binary is executable
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "Checking that '$CLANGXX' is on PATH and executable..."
          if ! command -v "$CLANGXX" > /dev/null 2>&1; then
            echo "FAIL: '$CLANGXX' not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANGXX found at $(command -v "$CLANGXX")"

      - name: Assert cc symlink exists
        run: |
          echo "Checking that 'cc' symlink exists..."
          if ! command -v cc > /dev/null 2>&1; then
            echo "FAIL: 'cc' not found on PATH"
            exit 1
          fi
          echo "PASS: cc found at $(command -v cc)"

      - name: Assert c++ symlink exists
        run: |
          echo "Checking that 'c++' symlink exists..."
          if ! command -v c++ > /dev/null 2>&1; then
            echo "FAIL: 'c++' not found on PATH"
            exit 1
          fi
          echo "PASS: c++ found at $(command -v c++)"

      - name: Assert clang can compile a simple program
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Compiling a simple C program with $CLANG..."
          cat > /tmp/hello.c << 'EOF'
          #include <stdio.h>
          int main() { printf("hello\n"); return 0; }
          EOF
          "$CLANG" /tmp/hello.c -o /tmp/hello
          OUTPUT=$(/tmp/hello)
          if [ "$OUTPUT" != "hello" ]; then
            echo "FAIL: expected 'hello', got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: compiled and ran successfully"
