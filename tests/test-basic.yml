name: Test basic usage (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell (act image lacks pwsh)
        run: |
          set -e
          if command -v pwsh >/dev/null 2>&1; then pwsh --version; exit 0; fi
          SUDO=""; if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          VER=7.4.6
          URL="https://github.com/PowerShell/PowerShell/releases/download/v${VER}/powershell-${VER}-linux-${ARCH}.tar.gz"
          if command -v curl >/dev/null 2>&1; then curl -fsSL "$URL" -o /tmp/pwsh.tgz; else wget -q "$URL" -O /tmp/pwsh.tgz; fi
          $SUDO mkdir -p /opt/microsoft/powershell/7
          $SUDO tar -xzf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7
          $SUDO chmod +x /opt/microsoft/powershell/7/pwsh
          $SUDO ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          $SUDO ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh
          pwsh --version
      - id: action
        uses: .
      - name: Assert outputs
        env:
          CLANG: ${{ steps.action.outputs.clang }}
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clang: $CLANG"
          echo "clangxx: $CLANGXX"
          if [ "$CLANG" != "clang" ]; then
            echo "FAIL: expected clang output 'clang'"
            exit 1
          fi
          if [ "$CLANGXX" != "clang++" ]; then
            echo "FAIL: expected clangxx output 'clang++'"
            exit 1
          fi
          echo "PASS"
      - name: Assert clang binaries are available
        run: |
          clang --version || { echo "FAIL: clang not runnable"; exit 1; }
          clang++ --version || { echo "FAIL: clang++ not runnable"; exit 1; }
          echo "PASS"
      - name: Assert cc/c++ links point to clang
        run: |
          ls -l /usr/local/bin/cc /usr/local/bin/c++ || { echo "FAIL: links missing"; exit 1; }
          cc_out="$(/usr/local/bin/cc --version)"
          cxx_out="$(/usr/local/bin/c++ --version)"
          echo "$cc_out"
          echo "$cxx_out"
          echo "$cc_out" | grep -qi clang || { echo "FAIL: cc is not clang"; exit 1; }
          echo "$cxx_out" | grep -qi clang || { echo "FAIL: c++ is not clang"; exit 1; }
          echo "PASS"
