name: Test compiling with installed clang
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell (act image lacks pwsh)
        run: |
          set -e
          if command -v pwsh >/dev/null 2>&1; then pwsh --version; exit 0; fi
          SUDO=""; if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          VER=7.4.6
          URL="https://github.com/PowerShell/PowerShell/releases/download/v${VER}/powershell-${VER}-linux-${ARCH}.tar.gz"
          if command -v curl >/dev/null 2>&1; then curl -fsSL "$URL" -o /tmp/pwsh.tgz; else wget -q "$URL" -O /tmp/pwsh.tgz; fi
          $SUDO mkdir -p /opt/microsoft/powershell/7
          $SUDO tar -xzf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7
          $SUDO chmod +x /opt/microsoft/powershell/7/pwsh
          $SUDO ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          $SUDO ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh
          pwsh --version
      - id: action
        uses: .
        with:
          version: latest
          platform: x64
      - name: Compile and run C and C++ programs
        env:
          CLANG: ${{ steps.action.outputs.clang }}
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          set -e
          d="$(mktemp -d)"
          printf '#include <stdio.h>\nint main(void){puts("hello-c");return 0;}\n' > "$d/a.c"
          printf '#include <iostream>\nint main(){std::cout<<"hello-cxx"<<std::endl;return 0;}\n' > "$d/b.cpp"
          "$CLANG" "$d/a.c" -o "$d/a"
          "$CLANGXX" "$d/b.cpp" -o "$d/b"
          out_c="$("$d/a")"
          out_cxx="$("$d/b")"
          echo "c: $out_c"; echo "cxx: $out_cxx"
          [ "$out_c" = "hello-c" ] || { echo "FAIL: C program output"; exit 1; }
          [ "$out_cxx" = "hello-cxx" ] || { echo "FAIL: C++ program output"; exit 1; }
          cc "$d/a.c" -o "$d/a2" && [ "$("$d/a2")" = "hello-c" ] || { echo "FAIL: cc compile"; exit 1; }
          echo "PASS"
