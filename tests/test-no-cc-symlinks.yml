name: Test cc=0 (no symlink creation)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "Installing PowerShell..."
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends \
              wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          else
            echo "PowerShell already available: $(pwsh --version)"
          fi

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: '0'

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output is '$CLANG'"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output is '$CLANGXX'"

      - name: Assert clang output equals 'clang' for latest
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ "$CLANG" != "clang" ]; then
            echo "FAIL: expected 'clang' but got '$CLANG'"
            exit 1
          fi
          echo "PASS"

      - name: Assert clang binary is installed
        run: |
          echo "Checking if 'clang' is available..."
          if ! command -v clang > /dev/null 2>&1; then
            echo "FAIL: 'clang' not found in PATH"
            exit 1
          fi
          echo "PASS: 'clang' is available at $(command -v clang)"
          clang --version

      - name: Assert cc is NOT a clang symlink created by this action
        run: |
          # When cc=0, the action should NOT have created a cc -> clang symlink.
          # cc may still exist (e.g. pointing to gcc), but it should NOT point to clang.
          echo "Checking that 'cc' does not point to clang (action should not have created it)..."
          if command -v cc > /dev/null 2>&1; then
            CC_PATH="$(command -v cc)"
            CC_REAL="$(readlink -f "$CC_PATH" 2>/dev/null || echo "$CC_PATH")"
            echo "cc resolves to: $CC_REAL"
            if echo "$CC_REAL" | grep -qi 'clang'; then
              echo "FAIL: 'cc' points to clang, but cc=0 was set — action should not have created this symlink"
              exit 1
            fi
            echo "PASS: 'cc' does not point to clang (as expected with cc=0)"
          else
            echo "PASS: 'cc' not found in PATH (no symlink created, as expected with cc=0)"
          fi
