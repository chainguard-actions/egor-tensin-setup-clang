name: Test no cc symlinks (cc=0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell if not present
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "pwsh not found, installing..."
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends \
              wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          else
            echo "pwsh already available: $(pwsh --version)"
          fi

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: 0

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output = $CLANG"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output = $CLANGXX"

      - name: Assert clang binary is executable
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that '$CLANG' is on PATH and executable..."
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: '$CLANG' not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANG found at $(command -v "$CLANG")"

      - name: Assert cc symlink was NOT created
        run: |
          echo "Checking that 'cc' symlink was NOT created by the action..."
          # The action creates cc in /usr/local/bin when cc=1
          # When cc=0, it should not be there (or at least not pointing to clang)
          CC_PATH=$(command -v cc 2>/dev/null || true)
          echo "cc path: $CC_PATH"
          if [ -n "$CC_PATH" ]; then
            # cc may exist as a system default (e.g. gcc), but should not be clang
            CC_REAL=$(readlink -f "$CC_PATH" 2>/dev/null || true)
            echo "cc resolves to: $CC_REAL"
            if echo "$CC_REAL" | grep -qi "clang"; then
              echo "FAIL: 'cc' points to clang but cc=0 was set"
              exit 1
            fi
            echo "PASS: 'cc' exists but does not point to clang (it's a system default)"
          else
            echo "PASS: 'cc' not found on PATH (no symlink created)"
          fi

      - name: Assert c++ symlink was NOT created
        run: |
          echo "Checking that 'c++' symlink was NOT created by the action..."
          CPP_PATH=$(command -v c++ 2>/dev/null || true)
          echo "c++ path: $CPP_PATH"
          if [ -n "$CPP_PATH" ]; then
            CPP_REAL=$(readlink -f "$CPP_PATH" 2>/dev/null || true)
            echo "c++ resolves to: $CPP_REAL"
            if echo "$CPP_REAL" | grep -qi "clang"; then
              echo "FAIL: 'c++' points to clang but cc=0 was set"
              exit 1
            fi
            echo "PASS: 'c++' exists but does not point to clang (it's a system default)"
          else
            echo "PASS: 'c++' not found on PATH (no symlink created)"
          fi
