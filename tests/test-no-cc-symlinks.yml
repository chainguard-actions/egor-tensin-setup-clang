name: Test cc=0 (skip cc/c++ symlink setup)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          # Install pwsh if not already available
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "Installing PowerShell..."
            sudo apt-get update -q
            sudo apt-get install -yq wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          else
            echo "pwsh already available: $(pwsh --version)"
          fi

      - name: Record pre-existing cc path (if any)
        id: pre
        run: |
          PRE_CC="$(command -v cc 2>/dev/null || echo '')"
          echo "pre_cc=$PRE_CC" >> "$GITHUB_OUTPUT"
          echo "Pre-existing cc: $PRE_CC"

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: 0

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output = $CLANG"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output = $CLANGXX"

      - name: Assert clang binary is available
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that $CLANG is on PATH"
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: $CLANG not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANG is available"

      - name: Assert cc symlink was NOT created by action (cc=0)
        env:
          PRE_CC: ${{ steps.pre.outputs.pre_cc }}
        run: |
          CURRENT_CC="$(command -v cc 2>/dev/null || echo '')"
          echo "Pre-existing cc: $PRE_CC"
          echo "Current cc: $CURRENT_CC"
          # If cc didn't exist before and now it does, the action created it -- that's a FAIL
          if [ -z "$PRE_CC" ] && [ -n "$CURRENT_CC" ]; then
            # Check if it points to clang -- if so, action created it despite cc=0
            REAL="$(readlink -f "$CURRENT_CC" 2>/dev/null || true)"
            if echo "$REAL" | grep -qi clang; then
              echo "FAIL: cc symlink pointing to clang was created even though cc=0"
              exit 1
            fi
          fi
          echo "PASS: cc symlink was not created by the action (cc=0 respected)"

      - name: Assert clang can still compile a simple program
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Testing $CLANG can compile a simple C program"
          printf '#include <stdio.h>\nint main() { printf("hello\\n"); return 0; }\n' > /tmp/hello2.c
          "$CLANG" /tmp/hello2.c -o /tmp/hello2
          OUTPUT="$(/tmp/hello2)"
          echo "Output: $OUTPUT"
          if [ "$OUTPUT" != "hello" ]; then
            echo "FAIL: expected 'hello' but got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: clang compiled and ran successfully"
