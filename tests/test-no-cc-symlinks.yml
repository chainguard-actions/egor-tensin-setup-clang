name: Test no cc symlinks (cc=0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends powershell || true
          if ! command -v pwsh > /dev/null 2>&1; then
            wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: '0'
      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output = $CLANG"
      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clang++ output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output = $CLANGXX"
      - name: Assert clang binary is available
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that $CLANG is available..."
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: $CLANG not found in PATH"
            exit 1
          fi
          echo "PASS: $CLANG is available at $(command -v $CLANG)"
      - name: Assert cc symlink is NOT created in /usr/local/bin
        run: |
          echo "Checking that /usr/local/bin/cc does not exist (was not created by this action)..."
          # The system may have a pre-existing cc (e.g. gcc-based), but the action
          # should not have created a clang-based one in /usr/local/bin when cc=0.
          # We verify /usr/local/bin/cc does not point to clang.
          if [ -L /usr/local/bin/cc ]; then
            target=$(readlink -f /usr/local/bin/cc)
            echo "Found symlink /usr/local/bin/cc -> $target"
            if echo "$target" | grep -qi clang; then
              echo "FAIL: /usr/local/bin/cc points to clang but cc=0 was set"
              exit 1
            fi
          fi
          echo "PASS: no clang-based cc symlink in /usr/local/bin"
