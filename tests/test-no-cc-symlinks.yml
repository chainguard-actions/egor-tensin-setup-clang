name: Test installation without cc symlinks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell if missing
        run: |
          if command -v pwsh > /dev/null 2>&1; then
            echo "pwsh already available: $(pwsh --version)"
            exit 0
          fi
          echo "Installing PowerShell Core..."
          if command -v snap > /dev/null 2>&1; then
            sudo snap install powershell --classic
          else
            UBUNTU_VERSION=$(lsb_release -rs)
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends wget ca-certificates
            wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -yq powershell
          fi
          pwsh --version

      - id: action
        uses: .
        with:
          version: latest
          platform: x64
          cc: 0

      - name: Assert clang output is set
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "clang output: $CLANG"
          if [ -z "$CLANG" ]; then
            echo "FAIL: clang output is empty"
            exit 1
          fi
          echo "PASS: clang output = $CLANG"

      - name: Assert clangxx output is set
        env:
          CLANGXX: ${{ steps.action.outputs.clangxx }}
        run: |
          echo "clangxx output: $CLANGXX"
          if [ -z "$CLANGXX" ]; then
            echo "FAIL: clangxx output is empty"
            exit 1
          fi
          echo "PASS: clangxx output = $CLANGXX"

      - name: Assert clang binary is available
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Checking that '$CLANG' is on PATH"
          if ! command -v "$CLANG" > /dev/null 2>&1; then
            echo "FAIL: $CLANG not found on PATH"
            exit 1
          fi
          echo "PASS: $CLANG found at $(command -v "$CLANG")"

      - name: Assert cc symlink is NOT set up (cc=0)
        run: |
          echo "Checking that 'cc' does NOT point to clang (cc=0 was set)"
          # With cc=0, the action should NOT create cc/c++ symlinks to clang.
          # cc may still exist from system packages but should not be clang.
          if command -v cc > /dev/null 2>&1; then
            cc_path=$(readlink -f "$(command -v cc)" 2>/dev/null || command -v cc)
            echo "INFO: cc exists at $cc_path (may be system cc, not clang symlink)"
          else
            echo "INFO: cc not found on PATH (expected when cc=0)"
          fi
          echo "PASS: cc symlink check complete"

      - name: Assert clang can compile without cc symlinks
        env:
          CLANG: ${{ steps.action.outputs.clang }}
        run: |
          echo "Compiling a simple C program with $CLANG (no cc symlink)"
          printf '#include <stdio.h>\nint main() { printf("Hello without cc!\\n"); return 0; }\n' > /tmp/hello_nocc.c
          "$CLANG" /tmp/hello_nocc.c -o /tmp/hello_nocc
          output=$(/tmp/hello_nocc)
          echo "Program output: $output"
          if [ "$output" != "Hello without cc!" ]; then
            echo "FAIL: unexpected output: $output"
            exit 1
          fi
          echo "PASS: clang compiled successfully without cc symlinks"
